name: Demo API journey

# Failure drills are manual-only. From Actions > Demo API journey > Run
# workflow, choose failure_mode to verify that the failure-only PostgreSQL
# diagnostics remain useful without printing DATABASE_URL or any other
# database credential. Keep the five named failure boundaries below in sync
# with the classifier in the final diagnostics step.
# Keep that final step failure-only (`if: failure()`), so successful journeys
# never dump service logs.
on:
  pull_request:
    paths:
      - ".github/workflows/demo-e2e.yml"
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/demo-e2e.yml"
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      failure_mode:
        description: "Optional CI diagnostics drill"
        required: false
        default: none
        type: choice
        options:
          - none
          - database-service
          - schema
          - api-startup
          - journey

permissions:
  contents: read

jobs:
  demo-e2e:
    name: Run seeded API journey
    runs-on: ubuntu-latest
    env:
      DEMO_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/travel_land_ci_demo
      DEMO_E2E_FAILURE_MODE: ${{ inputs.failure_mode || 'none' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel_land_ci_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_land_ci_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mask demo database URL in workflow logs
        run: echo "::add-mask::${DEMO_E2E_DATABASE_URL}"

      # This is deliberately a separate step from schema application. A
      # failed health check means the service is unavailable; it is not a
      # schema, API startup, or journey-test failure.
      - name: Exercise PostgreSQL service failure diagnostics
        id: database-service-drill
        if: ${{ env.DEMO_E2E_FAILURE_MODE == 'database-service' }}
        run: |
          echo "::error title=PostgreSQL service startup failure::Intentional diagnostics drill."
          exit 1

      - name: Verify PostgreSQL service is ready
        id: database-service-health
        run: |
          if ! docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d travel_land_ci_demo; then
            echo "::error title=PostgreSQL service startup failure::The PostgreSQL service is not accepting connections."
            exit 1
          fi

      - name: Apply current database schema
        id: database-schema
        env:
          DATABASE_URL: ${{ env.DEMO_E2E_DATABASE_URL }}
        run: |
          if [[ "$DEMO_E2E_FAILURE_MODE" == "schema" ]]; then
            echo "::error title=Database schema failure::Intentional diagnostics drill."
            exit 1
          fi
          pnpm --filter @workspace/db run push

      - name: Exercise API startup failure diagnostics
        id: api-startup-drill
        if: ${{ env.DEMO_E2E_FAILURE_MODE == 'api-startup' }}
        run: |
          echo "::error title=API startup/import failure::Intentional diagnostics drill."
          exit 1

      # Run this before the seeded journey so import, app assembly, and
      # listener failures cannot be reported as journey assertion failures.
      - name: Validate API startup and imports
        id: api-startup
        env:
          DEMO_E2E_PHASE: startup
        run: |
          pnpm --filter @workspace/api-server exec node \
            --import ../../scripts/node_modules/tsx/dist/loader.mjs \
            --test \
            --test-name-pattern="^API startup/import validation$" \
            src/routes/demo-e2e.test.ts

      - name: Run seeded API journey
        id: journey-test
        run: |
          if [[ "$DEMO_E2E_FAILURE_MODE" == "journey" ]]; then
            echo "::error title=Seeded API journey test failure::Intentional diagnostics drill."
            exit 1
          fi
          pnpm --filter @workspace/api-server run test:demo-e2e
          pnpm --filter @workspace/api-server run test:reports-e2e

      - name: Collect PostgreSQL service logs after failure
        if: ${{ failure() }}
        env:
          DATABASE_SERVICE_DRILL_OUTCOME: ${{ steps.database-service-drill.outcome }}
          DATABASE_SERVICE_HEALTH_OUTCOME: ${{ steps.database-service-health.outcome }}
          DATABASE_SCHEMA_OUTCOME: ${{ steps.database-schema.outcome }}
          API_STARTUP_DRILL_OUTCOME: ${{ steps.api-startup-drill.outcome }}
          API_STARTUP_OUTCOME: ${{ steps.api-startup.outcome }}
          JOURNEY_TEST_OUTCOME: ${{ steps.journey-test.outcome }}
        run: |
          failure_class="$(bash scripts/classify-demo-e2e-failure.sh)"

          echo "::notice title=Demo journey failure class::$failure_class"
          echo "::group::PostgreSQL service diagnostics (failure-only and supplemental)"
          echo "The failed step above remains the primary result: $failure_class."
          echo "Only PostgreSQL health metadata and service logs are collected here; database credentials are not printed."
          docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' "${{ job.services.postgres.id }}" 2>&1 || true
          docker logs "${{ job.services.postgres.id }}" 2>&1 || true
          echo "::endgroup::"
