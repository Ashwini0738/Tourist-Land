name: Demo API journey

on:
  pull_request:
    paths:
      - ".github/workflows/demo-e2e.yml"
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/demo-e2e.yml"
      - "artifacts/api-server/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-e2e:
    name: Run seeded API journey
    runs-on: ubuntu-latest
    env:
      DEMO_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/travel_land_ci_demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel_land_ci_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_land_ci_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply current database schema
        env:
          DATABASE_URL: ${{ env.DEMO_E2E_DATABASE_URL }}
        run: pnpm --filter @workspace/db run push

      - name: Run seeded API journey
        run: pnpm --filter @workspace/api-server run test:demo-e2e
