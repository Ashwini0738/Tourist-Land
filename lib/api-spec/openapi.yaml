openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Travel and land sourcing REST API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: discovery
  - name: properties
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/home:
    get:
      operationId: getHome
      tags: [discovery]
      responses:
        "200":
          description: Home discovery feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  featuredDestinations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                  featuredProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                required: [featuredDestinations, featuredProperties]
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [discovery]
      responses:
        "200":
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                required: [items]
  /v1/destinations/{id}:
    get:
      operationId: getDestination
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties:
    get:
      operationId: listProperties
      tags: [properties]
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                required: [items]
  /v1/properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties/{id}/enquiries:
    post:
      operationId: createPropertyEnquiry
      tags: [properties]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyEnquiryInput"
      responses:
        "202":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyEnquiryReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Get Clerk-backed session and local PIN configuration status
      responses:
        "200":
          description: Verified Clerk session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/setup-pin:
    post:
      operationId: setupPin
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PinInput" } } }
      responses:
        "201": { description: PIN configured, content: { application/json: { schema: { $ref: "#/components/schemas/PinConfigured" } } } }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/auth/login-pin:
    post:
      operationId: verifyLoginPin
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Verify local PIN only; does not create a session
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PinInput" } } }
      responses:
        "200": { description: PIN verified, content: { application/json: { schema: { $ref: "#/components/schemas/PinVerification" } } } }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Report Clerk session status; Clerk client performs refresh
      responses:
        "200": { description: Clerk session remains authoritative, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Return Clerk logout guidance; does not revoke a local session
      responses:
        "200": { description: Clerk logout guidance, content: { application/json: { schema: { $ref: "#/components/schemas/LogoutStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/change-pin:
    post:
      operationId: changePin
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangePinInput" } } }
      responses:
        "200": { description: PIN changed, content: { application/json: { schema: { $ref: "#/components/schemas/PinConfigured" } } } }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Clerk session is missing or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidInput:
      description: Request body is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Request conflicts with current PIN state
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: PIN verification temporarily locked
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Destination:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country: { type: string }
        summary: { type: string }
        imageKey: { type: string }
      required: [id, slug, name, region, country, summary, imageKey]
    Property:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        location: { type: string }
        area: { type: string }
        askingPrice: { type: string }
        propertyType: { type: string }
        verified: { type: boolean }
      required: [id, slug, title, location, area, askingPrice, propertyType, verified]
    PropertyEnquiryInput:
      type: object
      properties:
        message: { type: string, maxLength: 2000 }
        preferredContactMethod:
          type: string
          enum: [email, phone]
      required: [message, preferredContactMethod]
    PropertyEnquiryReceipt:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        message: { type: string }
      required: [id, status, message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    PinInput:
      type: object
      additionalProperties: false
      properties:
        pin: { type: string, pattern: "^[0-9]{4,6}$" }
      required: [pin]
    ChangePinInput:
      type: object
      additionalProperties: false
      properties:
        currentPin: { type: string, pattern: "^[0-9]{4,6}$" }
        newPin: { type: string, pattern: "^[0-9]{4,6}$" }
      required: [currentPin, newPin]
    AuthSessionStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        clerkUserId: { type: string }
        sessionId: { type: [string, "null"] }
        pinConfigured: { type: boolean }
        sessionAuthority: { type: string, enum: [clerk] }
      required: [authenticated, clerkUserId, sessionId, pinConfigured, sessionAuthority]
    PinConfigured:
      type: object
      properties:
        pinConfigured: { type: boolean }
        message: { type: string }
      required: [pinConfigured, message]
    PinVerification:
      type: object
      properties:
        verified: { type: boolean }
        sessionAuthority: { type: string, enum: [clerk] }
        message: { type: string }
      required: [verified, sessionAuthority, message]
    RefreshStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        sessionId: { type: [string, "null"] }
        sessionAuthority: { type: string, enum: [clerk] }
        message: { type: string }
      required: [authenticated, sessionId, sessionAuthority, message]
    LogoutStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        sessionAuthority: { type: string, enum: [clerk] }
        message: { type: string }
      required: [authenticated, sessionAuthority, message]