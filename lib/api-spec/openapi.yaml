openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Travel and land sourcing REST API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: discovery
  - name: properties
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/home:
    get:
      operationId: getHome
      tags: [discovery]
      responses:
        "200":
          description: Home discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /v1/home/banners:
    get:
      operationId: listHomeBanners
      tags: [discovery]
      responses:
        "200":
          description: Bounded development banner feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerList"
  /v1/home/destinations:
    get:
      operationId: listHomeDestinations
      tags: [discovery]
      responses:
        "200":
          description: Bounded development destination feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
  /v1/home/nearby:
    get:
      operationId: listHomeNearby
      tags: [discovery]
      summary: List general popular seed places, not device-location results
      responses:
        "200":
          description: Bounded general popular places feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
  /v1/home/events:
    get:
      operationId: listHomeEvents
      tags: [discovery]
      responses:
        "200":
          description: Bounded development event feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
  /v1/home/hotels:
    get:
      operationId: listHomeHotels
      tags: [discovery]
      responses:
        "200":
          description: Bounded development stay discovery feed, not availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelList"
  /v1/home/properties:
    get:
      operationId: listHomeProperties
      tags: [properties]
      responses:
        "200":
          description: Bounded development property discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [discovery]
      responses:
        "200":
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                required: [items]
  /v1/destinations/{id}:
    get:
      operationId: getDestination
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties:
    get:
      operationId: listProperties
      tags: [properties]
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                required: [items]
  /v1/properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties/{id}/enquiries:
    post:
      operationId: createPropertyEnquiry
      tags: [properties]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyEnquiryInput"
      responses:
        "202":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyEnquiryReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated Clerk session status
      responses:
        "200":
          description: Verified Clerk session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Report Clerk session status; Clerk client performs refresh
      responses:
        "200": { description: Clerk session remains authoritative, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Return Clerk logout guidance; does not revoke a local session
      responses:
        "200": { description: Clerk logout guidance, content: { application/json: { schema: { $ref: "#/components/schemas/LogoutStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Clerk session is missing or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidInput:
      description: Request body is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Request conflicts with the current resource state
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Destination:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country: { type: string }
        summary: { type: string }
        imageKey: { type: string }
      required: [id, slug, name, region, country, summary, imageKey]
    Banner:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
      required: [id, title, subtitle, ctaLabel, destinationId, imageKey]
    Place:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        location: { type: string }
        summary: { type: string }
        distanceLabel: { type: string }
        ratingLabel: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
      required: [id, name, category, location, summary, destinationId, imageKey]
    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        dateLabel: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
      required: [id, title, dateLabel, location, summary, destinationId, imageKey]
    Hotel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        ratingLabel: { type: string }
        priceLabel: { type: string }
        imageKey: { type: string }
      required: [id, name, location, summary, destinationId, ratingLabel, priceLabel, imageKey]
    Property:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        location: { type: string }
        area: { type: string }
        propertyType: { type: string }
        verified: { type: boolean }
        description: { type: string }
        discoveryLabel: { type: string }
        priceLabel: { type: string }
        imageKey: { type: string }
      required: [id, slug, title, location, area, propertyType, verified, description, discoveryLabel, priceLabel, imageKey]
    HomeData:
      type: object
      properties:
        notice: { type: string }
        banners:
          type: array
          items: { $ref: "#/components/schemas/Banner" }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
        nearby:
          type: array
          items: { $ref: "#/components/schemas/Place" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        hotels:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        featuredDestinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
        featuredProperties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
      required: [notice, banners, destinations, nearby, events, hotels, properties, featuredDestinations, featuredProperties]
    BannerList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Banner" }
      required: [items]
    DestinationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
      required: [items]
    PlaceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Place" }
      required: [items]
    EventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
      required: [items]
    HotelList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
      required: [items]
    PropertyList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Property" }
      required: [items]
    PropertyEnquiryInput:
      type: object
      properties:
        message: { type: string, maxLength: 2000 }
        preferredContactMethod:
          type: string
          enum: [email, phone]
      required: [message, preferredContactMethod]
    PropertyEnquiryReceipt:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        message: { type: string }
      required: [id, status, message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    AuthSessionStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        clerkUserId: { type: string }
        sessionId: { type: [string, "null"] }
        sessionAuthority: { type: string, enum: [clerk] }
      required: [authenticated, clerkUserId, sessionId, sessionAuthority]
    RefreshStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        sessionId: { type: [string, "null"] }
        sessionAuthority: { type: string, enum: [clerk] }
        message: { type: string }
      required: [authenticated, sessionId, sessionAuthority, message]
    LogoutStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        sessionAuthority: { type: string, enum: [clerk] }
        message: { type: string }
      required: [authenticated, sessionAuthority, message]