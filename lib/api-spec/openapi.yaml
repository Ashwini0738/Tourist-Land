openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Travel and land sourcing REST API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: discovery
  - name: properties
  - name: auth
  - name: vendor
  - name: admin
  - name: bookings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/home:
    get:
      operationId: getHome
      tags: [discovery]
      responses:
        "200":
          description: Home discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /v1/home/banners:
    get:
      operationId: listHomeBanners
      tags: [discovery]
      responses:
        "200":
          description: Bounded development banner feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerList"
  /v1/home/destinations:
    get:
      operationId: listHomeDestinations
      tags: [discovery]
      responses:
        "200":
          description: Bounded development destination feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
  /v1/home/nearby:
    get:
      operationId: listHomeNearby
      tags: [discovery]
      summary: List general popular seed places, not device-location results
      responses:
        "200":
          description: Bounded general popular places feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
  /v1/home/events:
    get:
      operationId: listHomeEvents
      tags: [discovery]
      responses:
        "200":
          description: Bounded development event feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
  /v1/home/hotels:
    get:
      operationId: listHomeHotels
      tags: [discovery]
      responses:
        "200":
          description: Bounded development stay discovery feed, not availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelList"
  /v1/hotels:
    get:
      operationId: searchHotels
      tags: [discovery]
      summary: Search the honest hotel discovery catalog, not live availability
      parameters:
        - name: q
          in: query
          description: Search hotel name, city, destination, or location.
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: destinationId
          in: query
          schema: { type: string }
        - name: checkIn
          in: query
          description: Optional future check-in date carried for future availability; it does not check inventory.
          schema: { type: string, format: date }
        - name: checkOut
          in: query
          description: Optional future check-out date carried for future availability; it does not check inventory.
          schema: { type: string, format: date }
        - name: adults
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: children
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: rooms
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: maxPrice
          in: query
          description: Sample nightly price ceiling; not a live price filter.
          schema: { type: number, minimum: 0 }
        - name: hotelType
          in: query
          schema: { type: string }
        - name: amenity
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0, maximum: 500 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, rating, price_asc, price_desc, distance]
      responses:
        "200":
          description: Paginated hotel discovery results with explicit development provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelSearchResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
  /v1/hotels/{id}:
    get:
      operationId: getHotel
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Hotel discovery detail, not a booking offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/rooms:
    get:
      operationId: listHotelRooms
      tags: [discovery]
      summary: List catalog-backed room details when room records exist
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Room details or an honest empty response when no room records exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelRoomList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/availability:
    get:
      operationId: getHotelAvailability
      tags: [discovery]
      summary: Check server-backed hotel availability for a future stay request
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: checkIn
          in: query
          required: true
          schema: { type: string, format: date }
        - name: checkOut
          in: query
          required: true
          schema: { type: string, format: date }
        - name: adults
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: children
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: rooms
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Server-backed room availability and authoritative price calculations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelAvailabilityResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/nearby:
    get:
      operationId: listHotelNearby
      tags: [discovery]
      summary: List catalog places associated with a hotel's destination
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Nearby catalog places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelNearbyList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: List only the authenticated traveller's bookings
      responses:
        "200":
          description: Owned hotel bookings grouped by current booking state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Create an unpaid development booking after final server revalidation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreateInput" }
      responses:
        "201":
          description: Booking created in payment-pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}:
    get:
      operationId: getBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Get one booking owned by the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/BookingReference"
      responses:
        "200":
          description: Owned booking detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}/checkout:
    post:
      operationId: createBookingCheckout
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Start Stripe Checkout for an owned payment-pending booking
      parameters:
        - $ref: "#/components/parameters/BookingReference"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Hosted checkout URL and the booking's processing payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCheckoutResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Cancel an eligible booking owned by the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/BookingReference"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/home/properties:
    get:
      operationId: listHomeProperties
      tags: [properties]
      responses:
        "200":
          description: Bounded development property discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
  /v1/explore/search:
    get:
      operationId: searchExplore
      tags: [discovery]
      summary: Search the seeded development discovery catalog
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: id
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: number, minimum: 1, maximum: 50, default: 12 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, popularity, distance, rating, price_asc, price_desc]
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: propertyType
          in: query
          schema: { type: string }
        - name: eventType
          in: query
          schema: { type: string }
        - name: amenity
          in: query
          schema: { type: string }
        - name: minArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: latitude
          in: query
          description: Optional user latitude used for honest distance sorting and radius filtering.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          description: Optional user longitude used for honest distance sorting and radius filtering.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          description: Optional radius in kilometres. Only records with catalog coordinates are eligible.
          schema: { type: number, minimum: 0, maximum: 500 }
      responses:
        "200":
          description: Paginated development discovery results and suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreSearchResponse" }
  /v1/explore/categories:
    get:
      operationId: listExploreCategories
      tags: [discovery]
      summary: List Explore discovery categories
      responses:
        "200":
          description: Discovery categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreCategoriesResponse" }
  /v1/explore/filters:
    get:
      operationId: getExploreFilters
      tags: [discovery]
      summary: Get valid Explore filters for a category
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Category-aware filter and sort options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreFiltersResponse" }
  /v1/favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: List the authenticated traveller's saved discovery items
      responses:
        "200":
          description: Saved discovery item references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/favorites/{entityType}/{entityId}:
    put:
      operationId: addFavorite
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: Save a discovery item for the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/FavoriteEntityType"
        - $ref: "#/components/parameters/FavoriteEntityId"
      responses:
        "200":
          description: Saved discovery item reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeFavorite
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: Remove a saved discovery item for the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/FavoriteEntityType"
        - $ref: "#/components/parameters/FavoriteEntityId"
      responses:
        "204":
          description: Favorite removed, or was already absent
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [discovery]
      responses:
        "200":
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                required: [items]
  /v1/destinations/{id}:
    get:
      operationId: getDestination
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties:
    get:
      operationId: listProperties
      tags: [properties]
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                required: [items]
  /v1/properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties/{id}/enquiries:
    post:
      operationId: createPropertyEnquiry
      tags: [properties]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyEnquiryInput"
      responses:
        "202":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyEnquiryReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated Clerk session status
      responses:
        "200":
          description: Verified Clerk session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/vendor/applications:
    post:
      operationId: submitVendorApplication
      tags: [vendor]
      summary: Submit a vendor application before creating a Clerk account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorApplicationInput" }
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorApplicationReceipt" }
        "200":
          description: Re-submitted rejected application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorApplicationReceipt" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/vendor/applications/status:
    get:
      operationId: getVendorApplicationStatus
      tags: [vendor]
      summary: Check a vendor application using its reference and email
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
        - name: email
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 320 }
      responses:
        "200":
          description: Safe application status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorApplicationStatusResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/auth/refresh:
    post:
      operationId: refreshAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Report Clerk session status; Clerk client performs refresh
      responses:
        "200": { description: Clerk session remains authoritative, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Return Clerk logout guidance; does not revoke a local session
      responses:
        "200": { description: Clerk logout guidance, content: { application/json: { schema: { $ref: "#/components/schemas/LogoutStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Get safe current-user profile and authoritative role
      responses:
        "200":
          description: Authenticated local user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/vendor/dashboard:
    get:
      operationId: getVendorDashboard
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated vendor or admin vendor dashboard status
      responses:
        "200":
          description: Vendor dashboard status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/vendor/profile:
    get:
      operationId: getVendorProfile
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated vendor profile
      responses:
        "200":
          description: Vendor profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/vendor/listings:
    get:
      operationId: listVendorListings
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: List listings owned by the authenticated approved vendor, or all listings for an admin viewer
      responses:
        "200":
          description: Vendor-owned listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createVendorListing
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Create a draft listing owned by the authenticated approved vendor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created draft listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/vendor/listings/{id}:
    patch:
      operationId: updateVendorListing
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Edit a listing owned by the authenticated approved vendor
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingUpdate" }
      responses:
        "200":
          description: Updated vendor listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/vendor/listings/{id}/publish:
    post:
      operationId: publishVendorListing
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Publish a draft listing owned by the authenticated approved vendor
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Published vendor listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/vendor/listings/{id}/archive:
    post:
      operationId: archiveVendorListing
      tags: [vendor]
      security: [{ bearerAuth: [] }]
      summary: Archive a listing owned by the authenticated approved vendor
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Archived vendor listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated admin dashboard status
      responses:
        "200":
          description: Admin dashboard status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: List safe local user records for platform administration
      responses:
        "200":
          description: Safe user records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CurrentUser" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/vendor-applications:
    get:
      operationId: listAdminVendorApplications
      tags: [admin]
