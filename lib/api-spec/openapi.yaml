openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Travel and land sourcing REST API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: discovery
  - name: properties
  - name: auth
  - name: vendor
  - name: admin
  - name: bookings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/home:
    get:
      operationId: getHome
      tags: [discovery]
      responses:
        "200":
          description: Home discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/home/banners:
    get:
      operationId: listHomeBanners
      tags: [discovery]
      deprecated: true
      responses:
        "200":
          description: Retired development banner feed; use the persisted featured-content feed instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerList"
  /v1/home/featured:
    get:
      operationId: listHomeFeatured
      tags: [discovery]
      summary: List active featured content in administrator-defined order
      responses:
        "200":
          description: Active featured content whose source records remain eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedContentList"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/home/destinations:
    get:
      operationId: listHomeDestinations
      tags: [discovery]
      responses:
        "200":
          description: Bounded development destination feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
  /v1/home/nearby:
    get:
      operationId: listHomeNearby
      tags: [discovery]
      summary: List general popular seed places, not device-location results
      responses:
        "200":
          description: Bounded general popular places feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
  /v1/home/events:
    get:
      operationId: listHomeEvents
      tags: [discovery]
      responses:
        "200":
          description: Bounded development event feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
  /v1/home/hotels:
    get:
      operationId: listHomeHotels
      tags: [discovery]
      responses:
        "200":
          description: Bounded development stay discovery feed, not availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelList"
  /v1/hotels:
    get:
      operationId: searchHotels
      tags: [discovery]
      summary: Search hotel discovery records with explicit provider provenance
      parameters:
        - name: q
          in: query
          description: Search hotel name, city, destination, or location.
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: destinationId
          in: query
          schema: { type: string }
        - name: checkIn
          in: query
          description: Optional future check-in date carried for future availability; it does not check inventory.
          schema: { type: string, format: date }
        - name: checkOut
          in: query
          description: Optional future check-out date carried for future availability; it does not check inventory.
          schema: { type: string, format: date }
        - name: adults
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: children
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: rooms
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: maxPrice
          in: query
          description: Sample nightly price ceiling; not a live price filter.
          schema: { type: number, minimum: 0 }
        - name: hotelType
          in: query
          schema: { type: string }
        - name: amenity
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0, maximum: 500 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, rating, price_asc, price_desc, distance]
      responses:
        "200":
          description: Paginated hotel discovery results with explicit development provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelSearchResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
  /v1/hotels/{id}:
    get:
      operationId: getHotel
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Hotel discovery detail, not a booking offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/rooms:
    get:
      operationId: listHotelRooms
      tags: [discovery]
      summary: List catalog-backed room details when room records exist
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Room details or an honest empty response when no room records exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelRoomList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/availability:
    get:
      operationId: getHotelAvailability
      tags: [discovery]
      summary: Check provider-backed hotel availability with freshness metadata
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: checkIn
          in: query
          required: true
          schema: { type: string, format: date }
        - name: checkOut
          in: query
          required: true
          schema: { type: string, format: date }
        - name: adults
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: children
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: rooms
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Provider-backed availability and pricing, or an explicit unavailable result when no live production provider is connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelAvailabilityResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/nearby:
    get:
      operationId: listHotelNearby
      tags: [discovery]
      summary: List catalog places associated with a hotel's destination
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Nearby catalog places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelNearbyList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: List only the authenticated traveller's bookings
      responses:
        "200":
          description: Owned hotel bookings grouped by current booking state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Create an unpaid booking only after final provider inventory revalidation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreateInput" }
      responses:
        "201":
          description: Booking created in payment-pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}:
    get:
      operationId: getBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Get one booking owned by the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/BookingReference"
      responses:
        "200":
          description: Owned booking detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}/checkout:
    post:
      operationId: createBookingCheckout
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Start Stripe Checkout for an owned payment-pending booking
      parameters:
        - $ref: "#/components/parameters/BookingReference"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Hosted checkout URL and the booking's processing payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCheckoutResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/bookings/{reference}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      summary: Cancel an eligible booking owned by the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/BookingReference"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/home/properties:
    get:
      operationId: listHomeProperties
      tags: [properties]
      responses:
        "200":
          description: Bounded development property discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
  /v1/explore/search:
    get:
      operationId: searchExplore
      tags: [discovery]
      summary: Search the seeded development discovery catalog
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: id
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: number, minimum: 1, maximum: 50, default: 12 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, popularity, distance, rating, price_asc, price_desc]
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: propertyType
          in: query
          schema: { type: string }
        - name: eventType
          in: query
          schema: { type: string }
        - name: amenity
          in: query
          schema: { type: string }
        - name: minArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: latitude
          in: query
          description: Optional user latitude used for honest distance sorting and radius filtering.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          description: Optional user longitude used for honest distance sorting and radius filtering.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          description: Optional radius in kilometres. Only records with catalog coordinates are eligible.
          schema: { type: number, minimum: 0, maximum: 500 }
      responses:
        "200":
          description: Paginated development discovery results and suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreSearchResponse" }
  /v1/explore/categories:
    get:
      operationId: listExploreCategories
      tags: [discovery]
      summary: List Explore discovery categories
      responses:
        "200":
          description: Discovery categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreCategoriesResponse" }
  /v1/explore/filters:
    get:
      operationId: getExploreFilters
      tags: [discovery]
      summary: Get valid Explore filters for a category
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Category-aware filter and sort options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreFiltersResponse" }
  /v1/favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: List the authenticated traveller's saved discovery items
      responses:
        "200":
          description: Saved discovery item references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/favorites/{entityType}/{entityId}:
    put:
      operationId: addFavorite
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: Save a discovery item for the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/FavoriteEntityType"
        - $ref: "#/components/parameters/FavoriteEntityId"
      responses:
        "200":
          description: Saved discovery item reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeFavorite
      tags: [favorites]
      security: [{ bearerAuth: [] }]
      summary: Remove a saved discovery item for the authenticated traveller
      parameters:
        - $ref: "#/components/parameters/FavoriteEntityType"
        - $ref: "#/components/parameters/FavoriteEntityId"
      responses:
        "204":
          description: Favorite removed, or was already absent
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: List notifications for the authenticated account
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paginated notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Get the unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationUnreadCount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Mark every unread notification as read
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsReadAllResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/notifications/push-token:
    post:
      operationId: registerPushToken
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Register a device push token without sending push messages
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenInput" }
      responses:
        "201":
          description: Push token registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushTokenResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/notifications/push-token/revoke:
    post:
      operationId: revokePushToken
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Revoke a previously registered device push token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenRevokeInput" }
      responses:
        "204": { description: Push token revoked }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/notifications/{id}:
    get:
      operationId: getNotification
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Get one notification owned by the authenticated account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      summary: Mark one owned notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Read notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hotels/{id}/reviews:
    get:
      operationId: listHotelReviewsForHotel
      tags: [reviews]
      summary: List published reviews and the real rating aggregate for a catalog hotel
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Published hotel reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HotelReviewList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/reviews:
    get:
      operationId: listMyReviews
      tags: [reviews]
      security: [{ bearerAuth: [] }]
      summary: List reviews authored by the authenticated traveller
      responses:
        "200":
          description: The authenticated traveller's reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: createReview
      tags: [reviews]
      security: [{ bearerAuth: [] }]
      summary: Review a hotel after a paid completed stay owned by the traveller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewInput" }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/reviews/eligible:
    get:
      operationId: listEligibleReviews
      tags: [reviews]
      security: [{ bearerAuth: [] }]
      summary: List completed paid hotel stays that can still be reviewed
      responses:
        "200":
          description: Eligible stays
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EligibleReviewList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/reviews/{id}:
    put:
      operationId: updateReview
      tags: [reviews]
      security: [{ bearerAuth: [] }]
      summary: Edit an owned review
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReviewInput" }
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteReview
      tags: [reviews]
      security: [{ bearerAuth: [] }]
      summary: Delete an owned review
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Review deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [discovery]
      responses:
        "200":
          description: Destination list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                required: [items]
  /v1/destinations/{id}:
    get:
      operationId: getDestination
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties:
    get:
      operationId: listProperties
      tags: [properties]
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Property"
                required: [items]
  /v1/properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/properties/{id}/enquiries:
    post:
      operationId: createPropertyEnquiry
      tags: [properties]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyEnquiryInput"
      responses:
        "202":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyEnquiryReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
