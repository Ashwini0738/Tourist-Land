components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    FavoriteEntityType:
      name: entityType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FavoriteEntityType"
    FavoriteEntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    BookingReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key reused when safely retrying the same create request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Clerk session is missing or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Authenticated identity is not authorized for this resource
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidInput:
      description: Request body is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Request conflicts with the current resource state
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required upstream service is temporarily unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    FavoriteEntityType:
      type: string
      enum: [destination, place, temple, attraction, event, food, hotel, property]
    Favorite:
      type: object
      properties:
        entityType: { $ref: "#/components/schemas/FavoriteEntityType" }
