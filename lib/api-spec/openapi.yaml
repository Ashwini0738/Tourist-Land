        "200":
          description: Pending vendor applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VendorApplication" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/vendor-approval-history:
    get:
      operationId: listAdminVendorApprovalHistory
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: List durable vendor approval decisions and email outcomes
      responses:
        "200":
          description: Vendor approval history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VendorApprovalHistory" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/vendor-listings:
    get:
      operationId: listAdminVendorListings
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Review listings created by vendors
      responses:
        "200":
          description: Vendor-owned listings with owner details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminListingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/vendor-applications/{id}/approve:
    post:
      operationId: approveVendorApplication
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Approve an application and send the Clerk vendor invitation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Approved and invited vendor application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorApplication" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/vendor-applications/{id}/reject:
    post:
      operationId: rejectVendorApplication
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Reject an application or revoke its pending invitation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rejected vendor application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorApplication" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/invitations/admin:
    post:
      operationId: inviteAdmin
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Invite an additional administrator through Clerk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailInvitationInput" }
      responses:
        "201":
          description: Administrator invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitation" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/invitations:
    get:
      operationId: listAdminInvitations
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: List administrator invitations
      responses:
        "200":
          description: Administrator invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminInvitation" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/users/{id}/role:
    put:
      operationId: setAdminUserRole
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Assign a primary role to a local user
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssignmentInput" }
      responses:
        "200":
          description: Updated safe user record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/vendors/{userId}/suspend:
    post:
      operationId: suspendVendor
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Suspend a vendor profile and remove active vendor access
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Suspended vendor profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    FavoriteEntityType:
      name: entityType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FavoriteEntityType"
    FavoriteEntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    BookingReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key reused when safely retrying the same create request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Clerk session is missing or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Authenticated identity is not authorized for this resource
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidInput:
      description: Request body is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Request conflicts with the current resource state
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: A required upstream service is temporarily unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    FavoriteEntityType:
      type: string
      enum: [destination, place, temple, attraction, event, food, hotel, property]
    Favorite:
      type: object
      properties:
        entityType: { $ref: "#/components/schemas/FavoriteEntityType" }
        entityId: { type: string }
      required: [entityType, entityId]
    FavoriteList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Favorite" }
      required: [items]
    Destination:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country: { type: string }
        summary: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, slug, name, region, country, summary, imageKey]
    Coordinates:
      type: object
      description: Public catalog coordinates with an explicit precision and source. Coordinates are optional.
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        precision:
          type: string
          enum: [place, area, region]
        source: { type: string }
      required: [latitude, longitude, precision, source]
    DestinationDetail:
      type: object
      properties:
        destination:
          $ref: "#/components/schemas/Destination"
        places:
          type: array
          items: { $ref: "#/components/schemas/Place" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        foods:
          type: array
          items: { $ref: "#/components/schemas/Food" }
        hotels:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
        nearby:
          type: array
          items: { $ref: "#/components/schemas/Place" }
        sourceNotice: { type: string }
      required: [destination, places, events, foods, hotels, nearby, sourceNotice]
    Banner:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, title, subtitle, ctaLabel, destinationId, imageKey]
    Place:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        location: { type: string }
        summary: { type: string }
        distanceLabel: { type: string }
        ratingLabel: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, name, category, location, summary, destinationId, imageKey]
    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        dateLabel: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, title, dateLabel, location, summary, destinationId, imageKey]
    Hotel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        ratingLabel: { type: string }
        priceLabel: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, name, location, summary, destinationId, ratingLabel, priceLabel, imageKey]
    HotelSummary:
      type: object
      description: A hotel discovery record with development or live provenance; never a booking offer.
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        hotelType: { type: string }
        rating: { type: number, minimum: 0, maximum: 5 }
        ratingLabel: { type: string }
        priceValue: { type: number, minimum: 0 }
        priceLabel: { type: string }
        imageKey: { type: string }
        amenities:
          type: array
          items: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        distanceKm: { type: number, minimum: 0 }
        source:
          type: string
          enum: [development, live, unavailable]
        sourceLabel: { type: string }
        sourceNotice: { type: string }
      required: [id, name, location, summary, destinationId, hotelType, rating, ratingLabel, priceValue, priceLabel, imageKey, amenities, source, sourceLabel, sourceNotice]
    HotelSearchResponse:
      type: object
      properties:
        notice: { type: string }
        page: { type: number, minimum: 1 }
        limit: { type: number, minimum: 1, maximum: 50 }
        total: { type: number, minimum: 0 }
        hasMore: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/HotelSummary" }
      required: [notice, page, limit, total, hasMore, items]
    HotelDetail:
      type: object
      properties:
        hotel: { $ref: "#/components/schemas/HotelSummary" }
        description: { type: string }
        address: { type: ["string", "null"] }
        checkInTime: { type: ["string", "null"] }
        checkOutTime: { type: ["string", "null"] }
        galleryImageKeys:
          type: array
          items: { type: string }
        sourceNotice: { type: string }
      required: [hotel, description, address, checkInTime, checkOutTime, galleryImageKeys, sourceNotice]
    HotelRoom:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        capacity: { type: number, minimum: 1 }
        nightlyRate: { type: number, minimum: 0 }
        currency: { type: string }
        status: { type: string }
      required: [id, name, capacity, nightlyRate, currency, status]
    HotelRoomList:
      type: object
      properties:
        hotelId: { type: string }
        notice: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/HotelRoom" }
      required: [hotelId, notice, items]
    HotelAvailabilityRoom:
      type: object
      description: A room result from a clearly labeled development or live availability provider.
      properties:
        id: { type: string }
        name: { type: string }
        imageKey: { type: string }
        bedType: { type: string }
        capacity: { type: number, minimum: 1 }
        amenities:
          type: array
          items: { type: string }
        availableUnits: { type: number, minimum: 0 }
        nightlyRate: { type: number, minimum: 0 }
        currency: { type: string }
        nights: { type: number, minimum: 1 }
        roomTotal: { type: number, minimum: 0 }
        source:
          type: string
          enum: [development, live, unavailable]
        sourceLabel: { type: string }
        sourceNotice: { type: string }
      required: [id, name, capacity, amenities, availableUnits, nightlyRate, currency, nights, roomTotal, source, sourceLabel, sourceNotice]
    HotelAvailabilityResponse:
      type: object
      description: Availability results and server-calculated pricing for a future stay request. Never a booking confirmation.
      properties:
        hotelId: { type: string }
        status:
          type: string
          enum: [available, no_availability, unavailable]
        notice: { type: string }
        source:
          type: string
          enum: [development, live, unavailable]
        sourceLabel: { type: string }
        sourceNotice: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: number, minimum: 1 }
        adults: { type: number, minimum: 1 }
        children: { type: number, minimum: 0 }
        rooms: { type: number, minimum: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/HotelAvailabilityRoom" }
        roomSubtotal: { type: number, minimum: 0 }
        taxes: { type: number, minimum: 0 }
        fees: { type: number, minimum: 0 }
        discounts: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        currency: { type: string }
      required: [hotelId, status, notice, source, sourceLabel, sourceNotice, checkIn, checkOut, nights, adults, children, rooms, items, roomSubtotal, total, currency]
    HotelNearbyPlace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        location: { type: string }
        summary: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
        distanceLabel: { type: string }
        ratingLabel: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, name, category, location, summary, destinationId, imageKey]
    HotelNearbyList:
      type: object
      properties:
        hotelId: { type: string }
        notice: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/HotelNearbyPlace" }
      required: [hotelId, notice, items]
    BookingCreateInput:
      type: object
      properties:
        hotelId: { type: string, minLength: 1, maxLength: 100 }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        adults: { type: integer, minimum: 1, maximum: 40 }
        children: { type: integer, minimum: 0, maximum: 40 }
        rooms: { type: integer, minimum: 1, maximum: 20 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/BookingCreateItem"
        guest:
          $ref: "#/components/schemas/BookingGuestInput"
      required: [hotelId, checkIn, checkOut, adults, children, rooms, items, guest]
    BookingCreateItem:
      type: object
      properties:
        roomId: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [roomId, quantity]
    BookingGuestInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 40 }
      required: [name, email, phone]
    BookingGuest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
      required: [name, email, phone]
    BookingHotel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        imageKey: { type: string }
      required: [id, name, location, imageKey]
    BookingItem:
      type: object
      properties:
        roomId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        nightlyRate: { type: number, minimum: 0 }
        roomTotal: { type: number, minimum: 0 }
        currency: { type: string }
      required: [roomId, name, quantity, nightlyRate, roomTotal, currency]
    BookingStatus:
      type: string
      enum: [pending_payment, confirmed, cancelled]
    PaymentStatus:
      type: string
      enum: [unpaid, processing, paid, failed, cancelled]
    Booking:
      type: object
      properties:
        reference: { type: string }
        hotel: { $ref: "#/components/schemas/BookingHotel" }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        nights: { type: integer, minimum: 1 }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0 }
        guestCount: { type: integer, minimum: 1 }
        roomCount: { type: integer, minimum: 1 }
        guest: { $ref: "#/components/schemas/BookingGuest" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BookingItem" }
        total: { type: number, minimum: 0 }
        currency: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        sourceNotice: { type: string }
        canCancel: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [reference, hotel, startsOn, endsOn, nights, adults, children, guestCount, roomCount, guest, items, total, currency, status, paymentStatus, sourceNotice, canCancel, createdAt, updatedAt]
    BookingResponse:
      type: object
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
      required: [booking]
    BookingCheckoutResponse:
      type: object
      properties:
        checkoutUrl: { type: string, format: uri }
        booking: { $ref: "#/components/schemas/Booking" }
      required: [checkoutUrl, booking]
    BookingList:
      type: object
      properties:
        notice: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
      required: [notice, items]
    Food:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        location: { type: string }
        summary: { type: string }
        ratingLabel: { type: string }
        destinationId: { type: string }
        imageKey: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
      required: [id, name, category, location, summary, destinationId, imageKey]
    Property:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        location: { type: string }
        area: { type: string }
        propertyType: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        amenities:
          type: array
          items: { type: string }
        verified: { type: boolean }
        description: { type: string }
        discoveryLabel: { type: string }
        priceLabel: { type: string }
        imageKey: { type: string }
      required: [id, slug, title, location, area, propertyType, verified, description, discoveryLabel, priceLabel, imageKey]
    HomeData:
      type: object
      properties:
        notice: { type: string }
        banners:
          type: array
          items: { $ref: "#/components/schemas/Banner" }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
        nearby:
          type: array
          items: { $ref: "#/components/schemas/Place" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        hotels:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        featuredDestinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
        featuredProperties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
      required: [notice, banners, destinations, nearby, events, hotels, properties, featuredDestinations, featuredProperties]
    BannerList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Banner" }
      required: [items]
    DestinationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
      required: [items]
    PlaceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Place" }
      required: [items]
    EventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
      required: [items]
    HotelList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Hotel" }
      required: [items]
    PropertyList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Property" }
      required: [items]
    ExploreItem:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [destination, place, temple, attraction, event, food, hotel, property]
        title: { type: string }
        location: { type: string }
        summary: { type: string }
        category: { type: string }
